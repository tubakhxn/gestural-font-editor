<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Gestural Font Editor</title>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <div id="shade"></div>
    <canvas id="cv"></canvas>
    <div id="tag" class="mono">GESTURAL TYPE / 21 LANDMARKS</div>
    <div id="top">
      <h1>Edit a letter<br>with your hand.</h1>
    </div>
    <div id="hint"></div>
    <div id="status" class="mono"></div>
    <div id="badge" class="mono" hidden>DEMO</div>
    <div id="keys" class="mono">[D] DEMO &nbsp; [R] RESET &nbsp; [H] HAND OVERLAY &nbsp; [F] FULLSCREEN</div>
  </div>
</body>
